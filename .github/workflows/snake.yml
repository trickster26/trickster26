# Renders the contribution grid as a snake eating the commits, and commits the
# result to the `output` branch. The README points at that branch, so the
# animation is served from this repo rather than a third-party host that can
# quietly go down.
name: Generate snake

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?palette=github-dark&color_snake=#ffb020&color_dots=#14171e,#5c626c,#b57a14,#ffb020,#ffd27a

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
