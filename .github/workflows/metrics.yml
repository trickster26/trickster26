# Renders the profile stats as an SVG committed to this repo.
#
# The usual widgets (github-readme-stats, summary-cards, trophy) are shared
# Vercel instances calling GitHub's API for every profile that embeds them, so
# they rate-limit constantly and serve an SVG that says ERROR!!! with a 200
# status. Generating here means the only quota involved is this repo's own.
name: Generate metrics

on:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: trickster26
          filename: metrics.svg
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Kolkata
          config_display: large

      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: trickster26
          filename: metrics.languages.svg
          template: classic
          base: ""
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_colors: 0:ffb020, 1:b57a14, 2:8a9099, 3:5c626c
          config_timezone: Asia/Kolkata
